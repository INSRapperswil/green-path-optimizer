apiVersion: 1

deleteDatasources:
  - name: influxdb
    orgId: 1

datasources:
  - name: influxdb
    type: influxdb
    access: proxy
    orgId: 1
    url: ${INFLUXDB_INIT_URL}
    jsonData:
      version: Flux
      organization: ${INFLUXDB_ORG}
      defaultBucket: default
      tlsSkipVerify: true
    secureJsonData:
      token: ${INFLUXDB_TOKEN}